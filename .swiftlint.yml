included:
  - Package.swift
  - Sources
  - Tests

excluded:
  - .build

strict: true
check_for_updates: false
reporter: xcode

disabled_rules:
  # SwiftFormat owns these layout decisions. Keeping the same concern out of
  # SwiftLint prevents the two tools from prescribing conflicting output.
  - closure_parameter_position
  - opening_brace
  - trailing_comma

opt_in_rules:
  - array_init
  - async_without_await
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - discarded_notification_center_observer
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - final_test_case
  - first_where
  - force_unwrapping
  - last_where
  - modifier_order
  - optional_enum_case_matching
  - prefer_key_path
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - xct_specific_matcher
  - yoda_condition

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 550
  error: 800

type_body_length:
  warning: 450
  error: 650

function_body_length:
  warning: 70
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20
