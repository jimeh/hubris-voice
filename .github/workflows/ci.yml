name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "16.0"
            developer_directory: /Applications/Xcode_16.0.app/Contents/Developer
            verify_bundle: false
          - xcode: "26.3"
            developer_directory: /Applications/Xcode_26.3.app/Contents/Developer
            verify_bundle: true
    env:
      DEVELOPER_DIR: ${{ matrix.developer_directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install locked tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Run checks
        run: mise run check

      - name: Verify ad-hoc app bundle
        if: matrix.verify_bundle
        run: mise run bundle:verify:adhoc
