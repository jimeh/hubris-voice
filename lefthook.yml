pre-commit:
  parallel: true
  jobs:
    - name: swift
      glob: "*.swift"
      exclude:
        - "Vendor/**"
        - "Experiments/**"
      run: mise exec -- swiftformat {staged_files} && mise exec -- swiftlint lint --strict {staged_files}
      stage_fixed: true

    - name: vendor-integrity
      glob: "{Vendor/**,third-party/vendor/**,Scripts/vendor*.ts}"
      run: mise run vendor:index-check && mise run vendor:check

    - name: tooling
      glob: "{Scripts/*.ts,package.json,bun.lock,bunfig.toml,tsconfig.json}"
      run: mise run check:scripts

    - name: zsh
      glob: "*.sh"
      run: mise exec -- shfmt --language-dialect zsh --indent 2 --binary-next-line --case-indent --write {staged_files} && zsh -n {staged_files}
      stage_fixed: true

    - name: toml
      glob: "{*.toml,mise.lock}"
      run: mise exec -- taplo format {staged_files} && mise exec -- taplo lint mise.toml && treeboot check && mise tasks validate
      stage_fixed: true

    - name: swiftlint-config
      glob: ".swiftlint.yml"
      run: mise exec -- swiftlint lint --strict --quiet

    - name: lefthook-config
      glob: "lefthook.yml"
      run: mise exec -- lefthook validate

    - name: bundle-metadata
      glob: "*.plist"
      run: plutil -lint {staged_files} && ./Tests/BundleMetadataTests.sh

    - name: github-actions
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise run lint:workflows
