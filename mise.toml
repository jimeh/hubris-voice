min_version = "2026.8.0"

[settings]
experimental = true
lockfile = true
minimum_release_age = "7d"

[tools]
actionlint = "latest"
bun = "1.4.0"
lefthook = "latest"
pinact = "latest"
"pipx:spdx-tools" = "latest"
ripgrep = "latest"
shellcheck = "latest"
shfmt = "latest"
syft = "latest"
swiftformat = "latest"
swiftlint = "latest"
taplo = "latest"
zizmor = "latest"
"github:jimeh/treeboot" = "0"

[tasks.setup]
description = "Install pinned tools and repository Git hooks"
run = ["mise install --locked", "lefthook install"]

[tasks.doctor]
description = "Check the macOS, Xcode, signing, tool, and hook setup"
run = "./Scripts/doctor.sh"

[tasks.treeboot]
description = "Bootstrap the current linked worktree"
run = "treeboot run"

[tasks.dev]
description = "Build, sign, and launch the development app"
depends = ["bundle"]
run = "open '.build/artifacts/Hubris Voice.app'"

[tasks.build]
description = "Build the debug executable"
run = "swift build"

[tasks.bundle]
description = "Build and sign the release app bundle"
run = "./Scripts/bundle.sh release"

[tasks."bundle:verify"]
description = "Build and strictly verify the signed release app bundle"
run = [
  "./Scripts/bundle.sh release",
  "plutil -lint '.build/artifacts/Hubris Voice.app/Contents/Info.plist'",
  "codesign --verify --deep --strict --verbose=2 '.build/artifacts/Hubris Voice.app'",
]

[tasks."bundle:verify:adhoc"]
description = "Build and verify an ad-hoc signed release app bundle for CI"
run = [
  "./Scripts/bundle.sh release adhoc",
  "plutil -lint '.build/artifacts/Hubris Voice.app/Contents/Info.plist'",
  "codesign --verify --deep --strict --verbose=2 '.build/artifacts/Hubris Voice.app'",
]

[tasks."bundle:verify:adhoc:sparkle"]
description = "Build and verify the universal updater-enabled ad-hoc app bundle"
depends = ["sparkle:prepare"]
run = '''
RELEASE_SHA="$(git rev-parse HEAD)" \
RELEASE_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - Support/Info.plist)" \
SPARKLE_PUBLIC_KEY_FILE="$PWD/Tests/Fixtures/SparklePublicKey" \
swift run --package-path Tools/ReleaseTool hubris-voice-release build-adhoc
'''

[tasks.format]
description = "Format Swift, zsh, and TOML files"
run = [
  "swiftformat Package.swift Sources Tests Tools/ReleaseTool/Package.swift Tools/ReleaseTool/Sources Tools/ReleaseTool/Tests",
  "shfmt --language-dialect zsh --indent 2 --binary-next-line --case-indent --write Scripts/*.sh Tests/*.sh",
  "taplo format mise.toml",
]

[tasks."format:check"]
description = "Check Swift, zsh, and TOML formatting without changing files"
run = [
  "swiftformat --lint Package.swift Sources Tests Tools/ReleaseTool/Package.swift Tools/ReleaseTool/Sources Tools/ReleaseTool/Tests",
  "shfmt --language-dialect zsh --indent 2 --binary-next-line --case-indent --diff Scripts/*.sh Tests/*.sh",
  "taplo format --check mise.toml",
]

[tasks."lint:swift"]
description = "Run strict SwiftLint checks"
run = "swiftlint lint --strict"

[tasks."lint:shell"]
description = "Parse all repository zsh scripts"
run = "zsh -n Scripts/*.sh Tests/*.sh"

[tasks."lint:architecture"]
description = "Enforce the HubrisVoiceCore system-framework boundary"
run = "./Scripts/lint-architecture.sh"

[tasks."lint:workflows"]
description = "Validate GitHub Actions syntax, security, and SHA pins"
run = [
  "actionlint -shellcheck shellcheck",
  "zizmor --offline .github/workflows",
  "pinact run -fix=false -no-api",
]

[tasks."lint:config"]
description = "Validate task, hook, TOML, and bundle metadata configuration"
run = [
  "mise tasks validate",
  "lefthook validate",
  "treeboot check",
  "taplo lint mise.toml",
  "plutil -lint Support/Info.plist",
  "plutil -lint Support/HubrisVoice.entitlements",
  "plutil -convert xml1 -o /dev/null .github/release-please-config.json",
  "plutil -convert xml1 -o /dev/null .github/.release-please-manifest.json",
  "./Scripts/prepare-sparkle.sh --manifest-only",
]

[tasks.lint]
description = "Run all static checks"
depends = [
  "check:scripts",
  "lint:swift",
  "lint:shell",
  "lint:config",
  "lint:architecture",
  "lint:workflows",
  "lint:vendor",
]

[tasks."lint:fix"]
description = "Apply safe SwiftLint corrections, then format"
run = ["swiftlint lint --fix", "mise run format"]

[tasks.typecheck]
description = "Compile all production Swift targets"
run = ["swift build", "swift build --package-path Tools/ReleaseTool"]

[tasks.test]
description = "Run bundle metadata, signing resolver, and Swift tests"
depends = ["typecheck"]
run = [
  "./Tests/BundleMetadataTests.sh",
  "./Tests/SigningIdentityResolverTests.sh",
  "./Tests/ReleaseConfigurationTests.sh",
  "swift test",
  "swift test --package-path Tools/ReleaseTool",
]

[tasks.check]
description = "Run formatting, linting, compilation, and tests"
depends = ["format:check", "lint", "test"]

[tasks.verify]
description = "Run the full pre-handoff check including signed bundle verification"
depends = ["check"]
run = "mise run bundle:verify"

[tasks."hooks:install"]
description = "Install the managed Git hooks"
run = "lefthook install"

[tasks."hooks:run"]
description = "Run the pre-commit hook against staged files"
run = "lefthook run pre-commit"

[tasks."tools:update"]
description = "Update eligible managed tools and refresh the lockfile"
run = ["mise up", "mise lock", "mise run check"]

[tasks.logs]
description = "Follow the sanitized Realtime diagnostic log"
run = "tail -F \"${HOME}/Library/Logs/HubrisVoice/realtime.log\""

[tasks.clean]
description = "Remove Swift build outputs"
run = "swift package clean"

[tasks."experiment:stt:audio"]
description = "Generate synthetic local STT experiment recordings with macOS TTS"
run = "/usr/bin/python3 Experiments/LocalSTT/prepare_audio.py"

[tasks."experiment:stt:setup"]
description = "Download and verify pinned local STT experiment models and native libraries"
run = "/usr/bin/python3 Experiments/LocalSTT/workflow.py setup"

[tasks."experiment:stt:build"]
description = "Build the isolated Swift FluidAudio and sherpa-onnx experiment runners"
run = "/usr/bin/python3 Experiments/LocalSTT/workflow.py build"

[tasks."experiment:stt:run"]
description = "Run prepared local STT experiments serially with network access denied"
run = "/usr/bin/python3 Experiments/LocalSTT/workflow.py run"

[tasks."experiment:stt:report"]
description = "Summarize local STT experiment transcripts, dictionary recovery, and timing"
run = "/usr/bin/python3 Experiments/LocalSTT/report.py"

[tasks."experiment:stt:record"]
description = "Open the local phrase recorder; benchmark automatically after 18 accepted takes"
depends = ["experiment:stt:build"]
run = "/usr/bin/python3 Experiments/LocalSTT/human_recordings.py launch"

[tasks."experiment:stt:human"]
description = "Rerun the offline comparison of the 18 accepted human recordings"
run = "/usr/bin/python3 Experiments/LocalSTT/human_recordings.py run"

[tasks."experiment:stt:correction:prepare"]
description = "Prepare isolated human correction fixtures and validate exact-alias rules"
run = "/usr/bin/python3 Experiments/LocalSTT/correction_sweep.py prepare"

[tasks."experiment:stt:correction:run"]
description = "Sweep FluidAudio correction controls against the prepared human corpus"
run = "/usr/bin/python3 Experiments/LocalSTT/correction_sweep.py run"

[tasks."experiment:stt:correction:report"]
description = "Compare correction gains, paired regressions, and excess dictionary mentions"
run = "/usr/bin/python3 Experiments/LocalSTT/correction_sweep.py report"

[tasks."experiment:stt:correction:probe"]
description = "Verify raw and corrected text are available from one FluidAudio inference run"
run = "/usr/bin/python3 Experiments/LocalSTT/correction_sweep.py probe"

[tasks."experiment:stt:cache:prepare"]
description = "Copy verified local STT assets to a dedicated Hubris-owned experiment directory"
run = "/usr/bin/python3 Experiments/LocalSTT/cache_isolation.py prepare"

[tasks."experiment:stt:cache:run"]
description = "Probe explicit model roots with network and shared-cache access denied"
run = "/usr/bin/python3 Experiments/LocalSTT/cache_isolation.py run"

[tasks."experiment:stt:cache:verify"]
description = "Validate cache-isolation results, expected failure, and asset integrity"
run = "/usr/bin/python3 Experiments/LocalSTT/cache_isolation.py verify"

[tasks."bundle:debug"]
description = "Build and sign a debug app with development diagnostics support"
run = "./Scripts/bundle.sh debug"

[tasks."dev:trace"]
description = "Launch the debug app with raw transcription and window-context tracing (quit first)"
depends = ["bundle:debug"]
run = "open '.build/artifacts/Hubris Voice.app' --args --development-trace"

[tasks."sparkle:prepare"]
description = "Download and verify the pinned Sparkle framework and release tools"
run = "./Scripts/prepare-sparkle.sh"

[tasks."sparkle:check"]
description = "Verify the prepared Sparkle distribution"
run = "./Scripts/prepare-sparkle.sh --check"

[tasks."release:validate"]
description = "Validate the exact release source and committed version"
run = "swift run --package-path Tools/ReleaseTool hubris-voice-release validate-source"

[tasks."release:macos"]
description = "Build, sign, notarize, and package the universal macOS release"
run = "swift run --package-path Tools/ReleaseTool hubris-voice-release build"

[tasks."release:appcast"]
description = "Generate the signed Sparkle appcast and final checksums"
run = "swift run --package-path Tools/ReleaseTool hubris-voice-release generate-appcast"

[tasks."release:validate-draft"]
description = "Validate the exact draft GitHub Release"
run = "swift run --package-path Tools/ReleaseTool hubris-voice-release validate-draft"

[tasks."release:upload"]
description = "Upload and verify the exact draft release assets"
run = "swift run --package-path Tools/ReleaseTool hubris-voice-release upload-assets"

[tasks."release:publish"]
description = "Publish the verified GitHub Release"
run = "swift run --package-path Tools/ReleaseTool hubris-voice-release publish"

[tasks."lint:vendor"]
description = "Verify pinned FluidAudio source and its ordered patch stack"
depends = ["vendor:check"]

[tasks."scripts:install"]
description = "Install locked TypeScript tooling dependencies"
run = "bun install --frozen-lockfile"

[tasks."typecheck:scripts"]
description = "Type-check repository scripts"
depends = ["scripts:install"]
run = "bun node_modules/typescript/bin/tsc --noEmit"

[tasks."test:scripts"]
description = "Test repository tooling with Bun"
depends = ["scripts:install"]
run = "bun test Scripts"

[tasks."check:scripts"]
description = "Type-check and test repository tooling"
depends = ["typecheck:scripts", "test:scripts"]

[tasks."vendor:check"]
description = "Verify vendored sources match their pinned archives and patches"
run = "bun Scripts/vendor.ts check"

[tasks."vendor:index-check"]
description = "Fail if vendor-related staged and working-tree inputs differ"
run = "bun Scripts/vendor.ts index-check"

[tasks."vendor:start"]
description = "Start a targeted vendor edit session: <source> <patch>"
run = "bun Scripts/vendor.ts start"

[tasks."vendor:finish"]
description = "Fold tested vendor edits into the selected patch and replay later patches: <source>"
run = "bun Scripts/vendor.ts finish"

[tasks."vendor:continue"]
description = "Resume a vendor session after resolving a replay conflict: <source>"
run = "bun Scripts/vendor.ts continue"

[tasks."vendor:status"]
description = "Show active vendor edit sessions, optionally for one source"
run = "bun Scripts/vendor.ts status"

[tasks."vendor:cancel"]
description = "Cancel a vendor session, retaining source edits and recovery state: <source>"
run = "bun Scripts/vendor.ts cancel"

[tasks."vendor:reopen"]
description = "Return a vendor session to editing, preserving source and replay work: <source>"
run = "bun Scripts/vendor.ts reopen"

[tasks."smoke:local:install"]
description = "Explicitly download and verify pinned local models in a Hubris-owned smoke directory (711 MB)"
run = "HUBRIS_LOCAL_MODEL_INSTALL_SMOKE=1 swift test --filter LocalModelInstallationSmokeTests"

[tasks."smoke:local:runtime"]
description = "Run native local transcription with network and shared SDK cache access denied (requires experiment fixtures)"
run = "./Scripts/smoke-local-runtime.sh"

[tasks."smoke:local:ui"]
description = "Render native local settings to .build/local-ui for visual inspection"
run = "HUBRIS_LOCAL_UI_SMOKE=1 swift test --filter LocalSettingsRenderingTests"
